<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumia Style Header</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>

  </style>
</head>
<body>
  <div class="top-banner">
    <div class="flash-sale">
      <div class="call-to-order">
        <span>Call To Order</span>
        <span class="phone-number">17269</span>
      </div>
      <div class="flash-sale-text">Flash Sale</div>
      <div class="limited-time">Limited Time Savings!</div>
    </div>
    <div class="secondary-top-bar">
      <a routerLink="/auth/register-seller" class="sell-on-jumia-link">
        <div class="sell-on-jumia">
          <img src="/images/header/star.png" alt="Sell Icon" class="small-icon">
          <span>Sell on Jumia</span>
        </div>
      </a>
      <div class="jumia-pay">
        <img src="/images/jumiaLogo.png" alt="Jumia Logo" class="jumia-logo">
      </div>
    </div>
  </div>

  <header class="main-header">
    <nav class="navbar navbar-expand-lg navbar-light">
      <div class="container">
        <a class="navbar-brand" href="#">
          JUMIA<span style="color: #f0c14b;">●</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                <i class="fas fa-shopping-cart"></i>
                Cart
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">View Cart</a></li>
                <li><a class="dropdown-item" href="#">Checkout</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#">Track Order</a></li>
              </ul>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                <span class="help-icon">?</span>
                Help
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">FAQs</a></li>
                <li><a class="dropdown-item" href="#">Contact Us</a></li>
                <li><a class="dropdown-item" href="#">Return Policy</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">
                <i class="fas fa-user"></i>
                Login
              </a>
            </li>
          </ul>
          <div class="search-container">
            <form class="d-flex" role="search">
              <input class="search-input" type="search" placeholder="Search for products, brands and categories..." aria-label="Search">
              <button class="search-btn" type="submit">Search</button>
            </form>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <div class="mainHomeContainer container">
    <div class="jumia-container">
      <app-category-list></app-category-list>

      <div class="main-content mt-4">
        <section class="slider-section">  
          <app-center-slider></app-center-slider>
        </section>
      </div>


    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
