<div class="search-filter">
  <input 
    type="text" 
    placeholder="Search orders..." 
    [(ngModel)]="searchTerm"
    class="search-input">
  <select [(ngModel)]="statusFilter" class="filter-select">
    <option value="">All Status</option>
    <option value="Pending">Pending</option>
    <option value="Processing">Processing</option>
    <option value="Shipped">Shipped</option>
    <option value="Delivered">Delivered</option>
    <option value="Cancelled">Cancelled</option>
  </select>
</div>

<div class="orders-table">
  <table>
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Customer</th>
        <th>Products</th>
        <th>Total</th>
        <th>Payment Status</th>
        <th>Status</th>
        <th>Order Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of filteredOrders">
        <td>#{{order.id}}</td>
        <td>{{order.customer}}</td>
        <td>
          <div class="products-list">
            <span *ngFor="let product of order.products; let last = last">
              {{product}}<span *ngIf="!last">, </span>
            </span>
          </div>
        </td>
        <td>\${{order.total}}</td>
        <td>{{order.paymentStatus}}</td>

        <!-- CHANGED: show status as plain text -->
        <td>
          <span class="status-label" [class]="order.status.toLowerCase()">{{ order.status }}</span>
        </td>

        <td>{{order.orderDate}}</td>
        <td>
          <button 
            class="btn btn-sm btn-warning" 
            (click)="cancelOrder(order)" 
            [disabled]="order.status.toLowerCase() === 'delivered' || order.status.toLowerCase() === 'cancelled'">
            Cancel
          </button>
          <button 
            class="btn btn-sm btn-success" 
            (click)="progressStatus(order)"
            [disabled]="order.status.toLowerCase() === 'delivered' || order.status.toLowerCase() === 'cancelled'">
            {{ getNextStatusLabel(order.status) }}
          </button>
          <button 
            class="btn btn-sm btn-info" 
            >
            View Details
          </button>
          <!-- (click)="viewOrderDetails(order)" -->
        </td>
      </tr>
    </tbody>
  </table>
</div>
