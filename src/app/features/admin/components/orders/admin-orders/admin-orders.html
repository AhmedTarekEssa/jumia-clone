<div class="search-filter">
        <input 
          type="text" 
          placeholder="Search orders..." 
          [(ngModel)]="searchTerm"
          class="search-input">
        <select [(ngModel)]="statusFilter" class="filter-select">
          <option value="">All Status</option>
          <option value="Pending">Pending</option>
          <option value="Processing">Processing</option>
          <option value="Shipped">Shipped</option>
          <option value="Delivered">Delivered</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>

      <div class="orders-table">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Products</th>
              <th>Total</th>
              <th>Status</th>
              <th>Order Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let order of filteredOrders">
              <td>#{{order.id}}</td>
              <td>{{order.customer}}</td>
              <td>
                <div class="products-list">
                  <span *ngFor="let product of order.products; let last = last">
                    {{product}}<span *ngIf="!last">, </span>
                  </span>
                </div>
              </td>
              <td>\${{order.total}}</td>
              <td>
                <select [(ngModel)]="order.status" class="status-select" [class]="order.status.toLowerCase()">
                  <option value="Pending">Pending</option>
                  <option value="Processing">Processing</option>
                  <option value="Shipped">Shipped</option>
                  <option value="Delivered">Delivered</option>
                  <option value="Cancelled">Cancelled</option>
                </select>
              </td>
              <td>{{order.orderDate}}</td>
              <td>
                <button class="btn btn-sm btn-primary">View</button>
                <button class="btn btn-sm btn-secondary">Print</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
