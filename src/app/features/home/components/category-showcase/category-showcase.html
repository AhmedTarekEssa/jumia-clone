<!-- Top-Picks-Container.component.html -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

<div class="flash-sales-container">
    <!-- Top banner with timer -->
    <div class="flash-sales-header">
        <div class="flash-sales-title">
            <i class="flash-icon"></i>
            <span><b>Trendy Outfits</b> | Starting 15EGP</span>
        </div>
        <div class="see-all">
            <a style="cursor: pointer;">See All <i class="ms-2 fas fa-chevron-right"></i></a>
        </div>
    </div>

    <!-- Products carousel -->
    <div class="products-carousel-container">
        <!-- Left scroll arrow -->
        <button class="scroll-arrow left-arrow">
            <i class="fas fa-chevron-left"></i>
        </button>

        <!-- Products container -->
        <div #productContainer class="products-container">
            <div class="product-card">
                <a class="text-decoration-none">
                    <!-- Discount badge -->
                    <div class="discount-badge">
                        %
                    </div>

                    <!-- Product image -->
                    <div class="product-image">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTHf5n2IQep8_NEGfGaCc_zNJjaS2QfxW7XQw&s"
                            [alt]="">
                    </div>

                    <!-- Product info -->
                    <div class="product-info">
                        <h3 class="product-name"></h3>
                        <div class="product-price">
                            <span class="final-price">EGP </span>
                            <br>
                            <span class="base-price">EGP </span>
                        </div>

                    </div>


                </a>
            </div>
        </div>

        <!-- Right scroll arrow -->
        <button class="scroll-arrow right-arrow">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>
